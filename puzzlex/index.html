<body class="share-page">
  <main>
    <h1>15 Puzzle – An Accessible Game</h1>
    <img src="sigla.png" alt="Wooden puzzle game logo displaying the text 15 Puzzle.">
    <p id="redirect-status" role="status">Opening the appropriate version for your device…</p>

    <nav aria-label="Choose a version manually">
      <ul>
        <li><a href="https://play.google.com/store/apps/details?id=ro.pontes.puzzlex">Google Play</a></li>
        <li><a href="https://apps.apple.com/app/id6480232251">App Store</a></li>
        <li><a href="https://puzzle.pontes.ro/">Play on the web</a></li>
      </ul>
    </nav>
  </main>

  <script>
    (function () {
      var userAgent = navigator.userAgent || navigator.vendor || '';
      var isAndroid = /android/i.test(userAgent);
      var isIOS = /iPad|iPhone|iPod/i.test(userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var destination = 'https://puzzle.pontes.ro/';

      if (isAndroid) {
        destination = 'https://play.google.com/store/apps/details?id=ro.pontes.puzzlex';
      } else if (isIOS) {
        destination = 'https://apps.apple.com/app/id6480232251';
      }

      window.location.replace(destination);
    }());
  </script>
</body>
